{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-3 col-lg-2">
        <div class="sidebar">
            <h5 class="mb-4" style="color: #ff1493;">
                <i class="fas fa-user-shield me-2"></i>Admin Panel
            </h5>
            <nav class="nav flex-column">
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_dashboard' }}" href="{{ url_for('admin_dashboard') }}">
                    <i class="fas fa-tachometer-alt"></i>Dashboard
                </a>
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_users' }}" href="{{ url_for('admin_users') }}">
                    <i class="fas fa-users"></i>User Management
                </a>
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_claims' }}" href="{{ url_for('admin_claims') }}">
                    <i class="fas fa-file-invoice"></i>Claims Overview
                </a>
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_reports' }}" href="{{ url_for('admin_reports') }}">
                    <i class="fas fa-chart-bar"></i>System Reports
                </a>
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_analytics' }}" href="{{ url_for('admin_analytics') }}">
                    <i class="fas fa-chart-pie"></i>Data Analytics
                </a>
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_settings' }}" href="{{ url_for('admin_settings') }}">
                    <i class="fas fa-cog"></i>Settings
                </a>
            </nav>
        </div>
    </div>
    <div class="col-md-9 col-lg-10 py-4 px-4">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
